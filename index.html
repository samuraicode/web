<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamuraiCode - Apps</title>
    <meta name="description" content="Apps by SamuraiCode. Crafted with care for iOS.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #ffffff;
            min-height: 100dvh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 5rem 0 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-wrap: balance;
        }

        .tagline {
            font-size: 1.15rem;
            color: #666;
            font-weight: 400;
            text-wrap: pretty;
        }

        .apps {
            padding: 4rem 0;
        }

        .app-card {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 2.5rem;
            border: 1px solid #f0f0f0;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out, border-color 0.2s ease-out;
            margin-bottom: 1.5rem;
        }

        .app-card:hover {
            border-color: #ddd;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transform: translateY(-2px);
        }

        .app-icon {
            font-size: 3.5rem;
            flex-shrink: 0;
        }

        .app-info h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            text-wrap: balance;
        }

        .app-info p {
            color: #666;
            font-size: 1.05rem;
            text-wrap: pretty;
        }

        .app-arrow {
            margin-left: auto;
            color: #ccc;
            font-size: 1.5rem;
            flex-shrink: 0;
            transition: color 0.2s ease-out;
        }

        .app-card:hover .app-arrow {
            color: #999;
        }

        footer {
            text-align: center;
            padding: 3rem 0;
            border-top: 1px solid #f0f0f0;
        }

        footer p {
            color: #666;
            font-size: 0.95rem;
        }

        .footer-link {
            color: #666;
            text-decoration: none;
            margin: 0 1rem;
            font-size: 0.95rem;
            transition: color 0.2s ease-out;
        }

        .footer-link:hover {
            color: #000;
        }

        @media (max-width: 768px) {
            header {
                padding: 3rem 0 1.5rem;
            }

            .logo {
                font-size: 2rem;
            }

            .app-card {
                padding: 1.5rem;
                gap: 1.25rem;
            }

            .app-icon {
                font-size: 2.5rem;
            }

            .app-info h2 {
                font-size: 1.25rem;
            }

            .app-info p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">SamuraiCode</div>
            <div class="tagline">Apps crafted with care</div>
        </div>
    </header>

    <main class="container">
        <section class="apps">
            <a href="isitout/" class="app-card">
                <div class="app-icon">🎬</div>
                <div class="app-info">
                    <h2>IsItOut</h2>
                    <p>Movie release countdown tracker. Never miss another release.</p>
                </div>
                <div class="app-arrow">&rsaquo;</div>
            </a>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SamuraiCode</p>
            <div style="margin-top: 1rem;">
                <a href="privacy-policy.html" class="footer-link">Privacy Policy</a>
                <a href="mailto:jeremy@samuraicode.com" class="footer-link">Contact</a>
                <a href="http://samuraicode.com" class="footer-link">SamuraiCode</a>
            </div>
        </div>
    </footer>
</body>
</html>
