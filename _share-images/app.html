<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
        position: relative;
    }
    .text {
        position: absolute;
        left: 88px;
        top: 72px;
        /* Extra bottom room: X overlays the page title on the bottom-left corner. */
        bottom: 124px;
        width: 620px;
        display: flex;
        flex-direction: column;
    }
    .app {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .icon {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        background: #f4f4f4;
        display: grid;
        place-items: center;
        font-size: 44px;
        line-height: 1;
    }
    .name { font-size: 36px; font-weight: 700; }
    h1 {
        margin-top: auto;
        font-size: 66px;
        line-height: 1.08;
        font-weight: 700;
    }
    .by {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        color: #666;
    }
    .by img { width: 32px; height: 32px; display: block; }
    .shot {
        position: absolute;
        right: 88px;
        top: 64px;
        width: 330px;
        border-radius: 34px;
        border: 1px solid #e5e5e5;
        overflow: hidden;
        background: #000;
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    }
    .shot img { width: 100%; display: block; }
</style>
</head>
<body>
    <div class="text">
        <div class="app">
            <span class="icon">{{icon}}</span>
            <span class="name">{{name}}</span>
        </div>
        <h1>{{headline}}</h1>
        <div class="by">
            <img src="file://{{root}}/favicon.svg" alt="">
            samuraicode.com/{{slug}}
        </div>
    </div>
    <div class="shot"><img src="file://{{root}}/{{shot}}" alt=""></div>
</body>
</html>
