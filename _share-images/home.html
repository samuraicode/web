<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
    }

    .wordmark {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 700;
    }

    .wordmark img {
        width: 52px;
        height: 52px;
        display: block;
    }

    h1 {
        margin-top: auto;
        font-size: 76px;
        line-height: 1.08;
        font-weight: 700;
        max-width: 760px;
    }

    .bottom {
        margin-top: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .icons {
        display: flex;
        gap: 18px;
    }

    .icon {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        background: #f4f4f4;
        display: grid;
        place-items: center;
        font-size: 44px;
        line-height: 1;
    }

    .url {
        font-size: 26px;
        color: #666;
    }
</style>
</head>
<body>
    <div class="wordmark">
        <img src="file://{{root}}/favicon.svg" alt="">
        SamuraiCode
    </div>

    <h1>Small, focused apps for iPhone.</h1>

    <div class="bottom">
        <div class="icons">
{{icons}}
        </div>
        <span class="url">samuraicode.com</span>
    </div>
</body>
</html>
