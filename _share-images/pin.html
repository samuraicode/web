<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1000px; height: 1500px; overflow: hidden; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1a1a1a;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
        position: relative;
        padding: 96px 88px 0;
    }
    .app {
        display: flex;
        align-items: center;
        gap: 24px;
    }
    .icon {
        width: 112px;
        height: 112px;
        border-radius: 26px;
        background: #f4f4f4;
        display: grid;
        place-items: center;
        font-size: 60px;
        line-height: 1;
    }
    .name { font-size: 48px; font-weight: 700; }
    h1 {
        margin-top: 64px;
        font-size: 92px;
        line-height: 1.06;
        font-weight: 700;
    }
    .by {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 32px;
        color: #666;
    }
    .by img { width: 40px; height: 40px; display: block; }
    .shot {
        position: absolute;
        left: 50%;
        top: 664px;
        transform: translateX(-50%);
        width: 520px;
        border-radius: 52px;
        border: 1px solid #e5e5e5;
        overflow: hidden;
        background: #000;
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    }
    .shot img { width: 100%; display: block; }
</style>
</head>
<body>
    <div class="app">
        <span class="icon">{{emoji}}</span>
        <span class="name">{{name}}</span>
    </div>
    <h1>{{headline}}</h1>
    <div class="by">
        <img src="file://{{root}}/favicon.svg" alt="">
        samuraicode.com/{{slug}}
    </div>
    <div class="shot"><img src="file://{{root}}/{{shot}}" alt=""></div>
</body>
</html>
